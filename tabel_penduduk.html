<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Data Penduduk</title>
    <style>
        table {
            border-collapse: collapse;
            width: 465px;
        }

        th, td {
            border: 1px solid black;
            padding: 4px 10px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }

        td:nth-child(2),
        td:nth-child(3) {
            text-align: right;
        }
    </style>
</head>
<body>

    <h2>Data Penduduk Kecamatan</h2>

    <table>
        <tr>
            <th>kecamatan</th>
            <th>luas</th>

        </tr>

        </tr>
        <tr>

        </tr>
        <tr>
            <td>Sayegan</td>

            <td>47129</td>
        </tr>
        <tr>
            <td>Godean</td>

        </tr>
        <tr>
            <td>Gamping</td>

    </table>

</body>
</html>
